name: Delete crash device test APKs

on:
  push:
    branches: [codex/delete-crash-device-tests]

permissions:
  contents: read

concurrency:
  group: delete-crash-device-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: rikkahub

    steps:
      - name: Checkout verification commit
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: rikkahub/web-ui/pnpm-lock.yaml

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('rikkahub/**/*.gradle*', 'rikkahub/gradle/wrapper/gradle-wrapper.properties', 'rikkahub/gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install web-ui dependencies
        working-directory: rikkahub/web-ui
        run: pnpm install --frozen-lockfile

      - name: Provide placeholder google-services.json
        run: cp ../.github/ci/google-services.json app/google-services.json

      - name: Build Debug and instrumentation APKs
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleGithubDebug :app:assembleGithubDebugAndroidTest --no-daemon --stacktrace

      - name: Upload device test APKs
        uses: actions/upload-artifact@v4
        with:
          name: delete-crash-device-apks-${{ github.run_number }}
          path: |
            rikkahub/app/build/outputs/apk/github/debug/*arm64-v8a*.apk
            rikkahub/app/build/outputs/apk/androidTest/github/debug/*.apk
          if-no-files-found: error
          retention-days: 7
