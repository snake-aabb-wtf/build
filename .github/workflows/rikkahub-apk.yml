name: RikkaHub APK

on:
  workflow_dispatch:
    inputs:
      gradle_task:
        description: "Gradle task to run"
        required: false
        default: ":app:assembleGithubRelease"
  push:
    branches: [main]
    paths:
      - "rikkahub/**"
      - ".github/workflows/rikkahub-apk.yml"
      - ".github/ci/google-services.json"

concurrency:
  group: rikkahub-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: rikkahub

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Restore signing config
        env:
          KEYSTORE_B64: ${{ secrets.RIKKAHUB_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RIKKAHUB_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RIKKAHUB_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RIKKAHUB_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "::error::missing RIKKAHUB_KEYSTORE_BASE64"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          cat > local.properties <<EOF
          storeFile=$RUNNER_TEMP/release.keystore
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          echo "signing config written ($(wc -c < "$RUNNER_TEMP/release.keystore") bytes keystore)"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" 2>/dev/null || echo "(no platforms yet)"
          ls "$ANDROID_HOME/build-tools" 2>/dev/null || echo "(no build-tools yet)"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: rikkahub/web-ui/pnpm-lock.yaml

      - name: Install web-ui dependencies
        working-directory: rikkahub/web-ui
        run: pnpm install --frozen-lockfile

      - name: Provide placeholder google-services.json
        run: cp ../.github/ci/google-services.json app/google-services.json

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('rikkahub/**/*.gradle*', 'rikkahub/gradle/wrapper/gradle-wrapper.properties', 'rikkahub/gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Run unit tests
        run: ./gradlew :app:testGithubDebugUnitTest --no-daemon --stacktrace

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew ${{ github.event.inputs.gradle_task || ':app:assembleGithubRelease' }} --no-daemon --stacktrace

      - name: Verify APK signature
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/github/release/*.apk | head -1)
          echo "APK: $APK"
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee /tmp/apksigner.txt
          grep -q "Verified using v1 scheme (JAR signing): true" /tmp/apksigner.txt \
            || { echo "::error::APK has no v1 (JAR) signature; Huawei installers reject it"; exit 1; }
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" /tmp/apksigner.txt \
            || { echo "::error::APK has no v2 signature"; exit 1; }
          grep -q "CN=RikkaHub Sol" /tmp/apksigner.txt \
            || { echo "::error::APK is not signed with the release certificate"; exit 1; }
          unzip -l "$APK" | grep -E "META-INF/.*\.(RSA|SF)" || true

      - name: Upload Room schemas
        uses: actions/upload-artifact@v4
        with:
          name: room-schemas
          path: rikkahub/app/schemas

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rikkahub-apk-${{ github.run_number }}
          path: |
            rikkahub/app/build/outputs/apk/**/*.apk
            rikkahub/app/build/outputs/mapping/**/mapping.txt
          if-no-files-found: warn
          retention-days: 30
